
services:
  backend:
    build: ./backend
    container_name: movo_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Local defaults. Production supplies DEBUG=0 and the managed Redis
      # credentials through its environment instead of these Compose defaults.
      DEBUG: ${DEBUG:-1}
      DB_NAME: movo_db
      DB_USER: movo_user
      DB_PASSWORD: movo_password
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A Movo worker --loglevel=INFO
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      DEBUG: ${DEBUG:-1}
      DB_NAME: movo_db
      DB_USER: movo_user
      DB_PASSWORD: movo_password
      DB_HOST: db
      DB_PORT: "5432"
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: movo_db
    environment:
      POSTGRES_USER: movo_user
      POSTGRES_PASSWORD: movo_password
      POSTGRES_DB: movo_db
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  redis:
    image: redis:7-alpine
    container_name: movo_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
